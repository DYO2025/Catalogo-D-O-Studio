async function mostrarProductosAdmin() {
const respuesta = await fetch(
    `${SUPABASE_URL}/rest/v1/productos?select=*`,
    {
        headers: supabaseHeaders
    }
);

productos = await respuesta.json();
const lista = document.getElementById("listaProductos");

lista.innerHTML = "";

productos.forEach(function(producto) {
    lista.innerHTML += `
        <div class="product" data-category="${producto.category}">
          
<img src="${producto.imagen}" alt="${producto.name}" style="width:100%; height:220px; object-fit:contain;">
            <div class="product-info">
                <h3>${producto.nombre}</h3>

                <div class="price">
                    $${producto.precio_usd} USD
                </div>

                <div class="cup">
                    ${Number(producto.precio_cup).toLocaleString()} CUP
                </div>

                <p>${producto.description || ""}</p>
               ${producto.disponible ? "🟢 DISPONIBLE" : "🔴 AGOTADO"}
               <button onclick="marcarAgotado(${producto.id})">
  ${producto.disponible ? "MARCAR AGOTADO" : "MARCAR DISPONIBLE"}
</button>
<button onclick="eliminarProducto(${producto.id})">ELIMINAR</button>
            </div>
        </div>
    `;
});

}
async function marcarAgotado(id) {
    const producto = productos.find(p => p.id === id);

    if (!producto) return;

    const nuevoEstado = !producto.disponible;

    const respuesta = await fetch(
        `${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`,
        {
            method: "PATCH",
            headers: {
              ...obtenerHeadersAdmin(),  
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
             disponible: nuevoEstado

            })
        }
    );

    if (!respuesta.ok) {
        console.error("Error al cambiar estado:", await respuesta.text());
        alert("No se pudo cambiar el estado.");
        return;
    }

    mostrarProductosAdmin();
}
async function eliminarProducto(id) {
    const producto = productos.find(p => p.id === id);
    if (!confirm("¿Seguro que quieres eliminar este producto?")) {
        return;
    }

    const respuesta = await fetch(
        `${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`,
        {
            method: "DELETE",
         headers: obtenerHeadersAdmin()
        }
    );

    if (!respuesta.ok) {
        console.error("Error al eliminar:", await respuesta.text());
        alert("No se pudo eliminar el producto.");
        return;
    }
    if (producto && producto.imagen && producto.imagen.includes("/Productos/")) {
    const nombreFoto = producto.imagen.split("/").pop();

    const respuestaFoto = await fetch(
        `${SUPABASE_URL}/storage/v1/object/Productos/${nombreFoto}`,
        {
            method: "DELETE",
           headers: obtenerHeadersAdmin()
        }
    );
  if (!respuestaFoto.ok) {
    console.error("Error al eliminar foto:", await respuestaFoto.text());
} else {

}  
}
